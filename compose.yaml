services:
  postgres:
    image: postgres:16-alpine
    container_name: qwesto-postgres
    environment:
      POSTGRES_DB: qwesto
      POSTGRES_USER: qwesto
      POSTGRES_PASSWORD: ${QWESTO_DB_PASSWORD:?Set QWESTO_DB_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - qwesto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwesto -d qwesto"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qwesto_postgres_data:
